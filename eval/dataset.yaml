# Evaluation question set for the /ask query layer.
# A mix of specific (vector-search) and analytical (aggregation) questions,
# including summary questions that must reflect the full distribution.
device_id: airq-001
questions:
  # Specific — particular events / current state / history
  - question: When was PM2.5 highest and how bad did it get?
  - question: How is the air quality right now?
  - question: Were there any unhealthy or hazardous air quality periods?
  - question: What was the worst CO2 level recorded?
  - question: Has the air ever reached dangerous levels?
  - question: What does the VOC index usually look like?
  # Analytical — aggregates over time
  - question: What has the average PM2.5 been over the past 90 days?
  - question: What was the highest CO2 reading recorded?
  - question: How many readings were taken in the last month?
  - question: What is the lowest temperature recorded?
  - question: What is the average humidity?
  # Summary — must reflect the full range, not a typical sample
  - question: What's the average air quality?
  - question: Overall, how clean has the air been?
  - question: Is this a healthy place to breathe?
  - question: Summarise the air quality over the whole dataset.
